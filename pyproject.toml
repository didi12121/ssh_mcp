[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-terminal-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.27,<2",
  "asyncssh>=2.24,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy[asyncio]>=2.0.48,<2.1",
  "aiosqlite>=0.22,<1",
  "cryptography>=46,<51",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2"]

[project.scripts]
terminal-mcp = "persistent_terminal_mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
